<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0906">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>三国杀 · 单机版</title>
<style>
/* ============================================================
   牌桌布局：对手围在上方弧线，自己在下方，中间是出牌区。
   卡牌全部用 CSS + SVG 手绘（不引用任何官方卡图），
   所以没有版权牵扯，美术风格也是自己定的。
   ============================================================ */
:root{
  --bg:#0a0906; --felt:#141c17; --felt2:#0d1410;
  --wood:#2a1f14; --wood2:#1a130c;
  --ink:#ece0cb; --dim:#9c8b73; --dim2:#6b5c48;
  --line:#3a2f25; --line2:#4d3d2c;
  --red:#c8102e; --red2:#e0344f; --gold:#d8a94b; --gold2:#f0cd7a;
  --jade:#4f9c78;
  --c-basic:#8c1f2a;   --c-basic2:#5e1119;
  --c-trick:#1f5c4a;   --c-trick2:#123a2e;
  --c-delay:#4a2a6a;   --c-delay2:#2e1a45;
  --c-weapon:#8a6a20;  --c-weapon2:#584313;
  --c-armor:#3a5a7a;   --c-armor2:#24384d;
  --c-horse:#6a4a2a;   --c-horse2:#452f19;
  --paper:#f4ead6; --paper2:#e2d4b8; --paperink:#241d15;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.4 -apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;overscroll-behavior:none;}
.hide{display:none!important;}
button{font:inherit;color:inherit;background:#241e19;border:1px solid var(--line);
  border-radius:9px;padding:9px 13px;cursor:pointer;transition:.12s;}
button:active{transform:scale(.97);}
button:disabled{opacity:.4;}
button.primary{background:linear-gradient(180deg,var(--red),#9c0c24);border-color:#7d0a1d;font-weight:600;}
button.gold{background:linear-gradient(180deg,#3a2d16,#2a2113);border-color:var(--gold);color:var(--gold2);}

/* ============================================================
   牌桌：**横版布局**（横向铺开，牌才能做大）
   上排对手 → 中间出牌区 → 底部：头像 + 手牌 + 操作
   ============================================================ */
#table{
  /* 尺寸体系：**全部从视口高度算**。
     手机横屏时高度非常紧（iPhone 横屏扣掉浏览器地址栏只剩 ~795px），
     所以每一块都要按 vh 给，不能用固定 px，否则底部的手牌会被挤出屏幕。
     --ch 是手牌高度，牌宽按 5:7 反推，保证"牌一定能完整显示"。 */
  --ch: clamp(78px, 25vh, 122px);
  --opp-h: clamp(64px, 18vh, 100px);
  --side-w: clamp(84px, 15vw, 150px);
  position:fixed;inset:0;display:grid;
  grid-template-rows:var(--opp-h) minmax(0,1fr) auto;
  grid-template-columns:var(--side-w) minmax(0,1fr);
  grid-template-areas:"opp  opp" "side field" "mine mine";
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,var(--felt) 0%,var(--felt2) 62%,#070906 100%);}
#table::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
  border:8px solid transparent;border-image:linear-gradient(180deg,var(--wood),var(--wood2)) 1;
  box-shadow:inset 0 0 90px rgba(0,0,0,.75);}

/* 上排：对手 */
#opponents{grid-area:opp;display:flex;justify-content:center;align-items:stretch;
  gap:clamp(4px,1.2vw,12px);padding:6px 10px 4px;overflow-x:auto;overflow-y:hidden;min-height:0;}
.seat{position:relative;flex:0 0 auto;width:clamp(90px,16vw,150px);min-height:0;border-radius:10px;
  background:linear-gradient(180deg,rgba(36,30,25,.94),rgba(20,16,12,.94));
  border:1px solid var(--line);padding:4px 7px;transition:.18s;
  display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.seat.turn{border-color:var(--gold);}
.seat.me{border-color:rgba(200,16,46,.6);}
.seat.dead{opacity:.4;filter:grayscale(.7);}
.seat .top{display:flex;justify-content:space-between;align-items:center;gap:4px;}
.seat .nm{font-size:11px;font-weight:600;line-height:1.2;word-break:break-all;
  flex:1 1 auto;min-width:0;overflow-wrap:anywhere;}
.seat .nm.sm{font-size:10px;}
.seat .gen{font-size:10px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seat .hpbar{display:flex;flex-wrap:wrap;gap:1px;margin-top:3px;line-height:1;}
.seat .hpbar i{width:7px;height:7px;border-radius:2px;background:var(--red2);display:block;}
.seat .hpbar i.lost{background:#3a2a20;}
.seat .row2{display:flex;justify-content:space-between;align-items:center;margin-top:3px;gap:3px;}
.seat .cards{display:flex;}
.seat .cards b{width:8px;height:13px;border-radius:2px;margin-left:-4px;
  background:linear-gradient(150deg,#3a2f22,#211a12);border:1px solid #55432c;}
.seat .cards b:first-child{margin-left:0;}
.badge{font-size:9px;padding:1px 4px;border-radius:4px;background:#31261a;color:var(--dim);
  border:1px solid rgba(255,255,255,.06);white-space:nowrap;}
.badge.lord{background:#3a2a12;color:var(--gold2);}
.badge.rebel{background:#3a1218;color:#f09aa8;}
.badge.loyal{background:#12303a;color:#8fd0e0;}
.badge.unknown{background:#241d15;color:var(--dim2);font-weight:700;}
.seat .eqs{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;}
.seat .eqs span{font-size:9px;padding:1px 4px;border-radius:4px;background:#241d15;
  border:1px solid var(--line2);color:var(--gold2);}
.seat .eqs span.j{border-color:#6a4a8a;color:#c8a8e8;}

/* 中间：出牌区 */
#field{grid-area:field;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;min-width:0;min-height:0;padding:4px;}
#turnInfo{font-size:12px;color:var(--dim);letter-spacing:1px;text-align:center;}
#turnInfo b{color:var(--gold2);}
#played{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  min-height:0;max-height:100%;}
#hintBar{max-width:min(70vw,620px);text-align:center;font-size:13px;padding:6px 12px;
  border-radius:9px;background:rgba(216,169,75,.1);border:1px solid rgba(216,169,75,.28);
  color:var(--gold2);}
#hintBar.wait{color:var(--dim);background:rgba(255,255,255,.04);border-color:var(--line);}
#hintBar.warn{color:#f0a0a8;background:rgba(200,16,46,.12);border-color:rgba(200,16,46,.4);}
#logBar{font-size:11px;color:var(--dim2);text-align:center;max-width:80vw;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 左侧：我的头像 + 状态 */
#side{grid-area:side;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:2px 4px 2px 10px;min-width:0;min-height:0;overflow:hidden;}

/* 底部：手牌 + 操作 */
#mine{grid-area:mine;display:flex;align-items:flex-end;gap:8px;min-height:0;
  padding:0 10px max(6px, env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.55) 40%);}
#handWrap{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;}
#myHand{display:flex;justify-content:center;align-items:flex-end;
  height:calc(var(--ch) + 12px);padding:12px 4px 0;max-width:100%;
  overflow-x:auto;overflow-y:visible;}
#actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:4px;
  min-height:30px;flex:0 0 auto;}

/* ---------- 卡牌 ---------- */
.pc{position:relative;flex:0 0 auto;width:calc(var(--ch) * 5 / 7);
  height:var(--ch);aspect-ratio:5/7;border-radius:7px;margin-left:clamp(-22px,-3.2vw,-8px);
  cursor:pointer;transition:transform .14s ease,box-shadow .14s ease;
  box-shadow:0 4px 10px rgba(0,0,0,.6);transform-origin:bottom center;}
.pc:first-child{margin-left:0;}
.pc.up{transform:translateY(-12px);box-shadow:0 10px 22px rgba(0,0,0,.7),0 0 0 2px var(--gold);}
.pc.dis{filter:grayscale(.75) brightness(.62);}
.pc .frame{position:absolute;inset:0;border-radius:7px;padding:2px;display:flex;flex-direction:column;
  background:linear-gradient(165deg,var(--frameA),var(--frameB));
  border:1px solid rgba(255,255,255,.22);}
.pc .inner{flex:1;border-radius:5px;background:linear-gradient(180deg,var(--paper),var(--paper2));
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:3px 3px 4px;overflow:hidden;position:relative;}
.pc .inner::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,rgba(0,0,0,.022) 0 3px,transparent 3px 7px);}
.pc .cname{font-size:clamp(10px,1.9vw,14px);font-weight:700;color:var(--paperink);
  letter-spacing:.5px;line-height:1.05;text-align:center;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pc .cname.tiny{font-size:clamp(8px,1.5vw,11px);}
.pc .icon{width:56%;aspect-ratio:1;flex:0 0 auto;margin:1px 0;}
.pc .icon svg{width:100%;height:100%;display:block;}
.pc .corner{position:absolute;font-size:9px;font-weight:700;line-height:1;display:flex;flex-direction:column;align-items:center;}
.pc .corner.tl{top:3px;left:3px;}
.pc .corner.br{bottom:3px;right:3px;transform:rotate(180deg);}
.pc .corner .s{font-size:8px;}
.pc .su{color:#1a1a1a;}
.pc .su.red{color:#b01020;}
.pc[data-k="basic"]  {--frameA:var(--c-basic);  --frameB:var(--c-basic2);}
.pc[data-k="trick"]  {--frameA:var(--c-trick);  --frameB:var(--c-trick2);}
.pc[data-k="delay"]  {--frameA:var(--c-delay);  --frameB:var(--c-delay2);}
.pc[data-k="weapon"] {--frameA:var(--c-weapon); --frameB:var(--c-weapon2);}
.pc[data-k="armor"]  {--frameA:var(--c-armor);  --frameB:var(--c-armor2);}
.pc[data-k="horse"]  {--frameA:var(--c-horse);  --frameB:var(--c-horse2);}
.pc[data-id="sha"]  {--frameA:#a3172a; --frameB:#600a17;}
.pc[data-id="shan"] {--frameA:#2a6a9a; --frameB:#164058;}
.pc[data-id="tao"]  {--frameA:#b8305a; --frameB:#7a1236;}
.pc[data-id="wuxiekeji"]{--frameA:#2a7a6a; --frameB:#134a3e;}
.pc[data-id="lebusishu"],.pc[data-id="shandian"]{--frameA:#5a3a8a; --frameB:#301c4d;}
/* 武器攻击范围 / 坐骑距离：左下角小徽章
   三种配色区分：武器=金，+1马=蓝（护自己），−1马=红（打别人） */
.pc .vb{position:absolute;left:3px;bottom:3px;z-index:3;
  font-size:9px;font-weight:700;line-height:1;padding:2px 3px;border-radius:4px;
  letter-spacing:0;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35);}
.pc .vb.range{background:#8a6a20;color:#fff6da;}
.pc .vb.plus{background:#2a5a8a;color:#dceeff;}
.pc .vb.minus{background:#8a2430;color:#ffe0e4;}
.pc.sm .vb{font-size:8px;padding:1px 3px;left:2px;bottom:2px;}
.pc .badgeX{position:absolute;top:-6px;right:-6px;background:var(--jade);color:#06120c;
  font-size:10px;padding:1px 5px;border-radius:6px;font-weight:700;z-index:2;}
.pc.sm{--ch: clamp(52px, 15vh, 80px);width:calc(var(--ch) * 5 / 7);height:var(--ch);
  margin-left:0;box-shadow:0 3px 8px rgba(0,0,0,.55);cursor:pointer;}
.pc.sm .cname{font-size:clamp(8px,1.4vw,11px);}
.pc.sm .corner{font-size:7px;pointer-events:none;}
.pc.sm .corner .s{font-size:6px;}
.pc.sm .su,.pc.sm .cname{pointer-events:none;}
.pc.revealed{box-shadow:0 0 0 2px var(--gold2),0 6px 16px rgba(216,169,75,.35);}
.revealTip{font-size:10px;color:var(--gold2);text-align:center;line-height:1.3;align-self:center;}

/* ---------- 头像 ---------- */
.avatar{position:relative;border-radius:12px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:2px solid var(--line2);overflow:hidden;
  background:linear-gradient(165deg,#3a2f22,#1c1611);
  box-shadow:0 4px 12px rgba(0,0,0,.5);transition:.15s;}
.avatar:active{transform:scale(.96);}
.avatar.lg{width:clamp(56px,11vh,96px);aspect-ratio:3/4;}
.avatar.sm{width:34px;aspect-ratio:1;}
.avatar .ch{font-size:clamp(26px,4.4vw,44px);font-weight:700;color:#f0e2c8;
  text-shadow:0 2px 8px rgba(0,0,0,.7);}
.avatar .kd{position:absolute;top:2px;left:3px;font-size:9px;padding:0 3px;border-radius:4px;
  background:rgba(0,0,0,.45);color:#e8dcc0;}
.avatar.wei{border-color:#4a7ab0;background:linear-gradient(165deg,#1e3350,#101c2e);}
.avatar.shu{border-color:#b0554a;background:linear-gradient(165deg,#4a1e1e,#2e1010);}
.avatar.wu{border-color:#4a9a7a;background:linear-gradient(165deg,#123a2e,#0a2019);}
.avatar.qun{border-color:#8a7a4a;background:linear-gradient(165deg,#3a3322,#1c1811);}
.avatar .hintDot{position:absolute;bottom:3px;right:3px;font-size:9px;color:var(--gold2);
  background:rgba(0,0,0,.5);border-radius:5px;padding:0 3px;}

#myStats{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;
  color:var(--dim);text-align:center;}
#myStats .hearts{color:var(--red2);letter-spacing:1px;font-size:13px;}
#myInfo{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;}

/* ---------- 详情弹窗 ---------- */
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);padding:16px;backdrop-filter:blur(3px);}
#modalBox{max-width:min(92vw,620px);max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,#221c16,#141110);border:1px solid var(--gold);
  border-radius:14px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.8);}
#modalBox .m-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
#modalBox h3{margin:0;font-size:19px;color:var(--gold2);letter-spacing:1px;}
#modalBox .m-sub{font-size:12px;color:var(--dim);}
#modalClose{margin-left:auto;padding:6px 12px;}
.det{min-width:0;}
.det-type{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;margin-bottom:7px;
  background:#2b231a;color:var(--dim);border:1px solid var(--line2);}
.det-type[data-k="basic"]{color:#f0a0a8;} .det-type[data-k="trick"]{color:#8fd8b8;}
.det-type[data-k="delay"]{color:#c0a0e8;} .det-type[data-k="weapon"]{color:var(--gold2);}
.det-type[data-k="armor"]{color:#9fc0e0;} .det-type[data-k="horse"]{color:#d8b090;}
.det-effect{font-size:14px;line-height:1.6;color:var(--ink);}
.det-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.det-meta span{font-size:11px;padding:2px 7px;border-radius:5px;background:#241d15;color:var(--dim2);}
.det-notes{margin-top:9px;font-size:12px;color:var(--dim);}
.det-notes summary{cursor:pointer;color:var(--gold2);}
.det-notes div{margin-top:6px;line-height:1.6;}
.det-empty{color:var(--dim);font-size:13px;}
.skill{padding:10px 0;border-bottom:1px solid var(--line);}
.skill:last-child{border-bottom:none;}
.sk-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.sk-head b{font-size:16px;color:var(--gold2);letter-spacing:1px;}
.sk-tag{font-size:10px;padding:1px 6px;border-radius:4px;background:#3a2a12;color:var(--gold2);}
.sk-timing{font-size:11px;color:var(--dim2);margin-top:3px;}
.sk-effect{font-size:13px;line-height:1.6;margin-top:4px;}

/* 竖屏（没横过来）：高度够但宽度窄，重点保证手牌完整 + 名字看得全 */
@media (orientation:portrait){
  #table{--ch:clamp(84px,11vh,120px);--opp-h:auto;--side-w:clamp(92px,26vw,132px);}
  #opponents{flex-wrap:wrap;justify-content:center;padding:6px;}
  .seat{width:clamp(84px,29vw,120px);}
  .seat .nm{font-size:12px;}
  #myHand{height:auto;min-height:calc(var(--ch) + 14px);padding:14px 4px 4px;}
  #hintBar{font-size:12px;padding:5px 10px;}
  #logBar{font-size:10px;}
}

/* 矮屏（横屏且高度紧张，比如小屏安卓或分屏）：再压一档，别让手牌被挤出去 */
@media (max-height:660px){
  #table{--ch:clamp(70px,22vh,104px);--opp-h:clamp(58px,16vh,86px);}
  #side{padding-left:6px;}
  .avatar.lg{width:clamp(48px,9vh,76px);}
  #myStats{font-size:10px;}
  #turnInfo{font-size:11px;}
  #hintBar{font-size:12px;padding:5px 10px;}
}
/* 超矮（竖屏窄高或极小分屏）：只保证核心能用 */
@media (max-height:480px){
  #table{--ch:clamp(62px,20vh,88px);--opp-h:clamp(52px,14vh,72px);}
  .seat .eqs{display:none;}
  #logBar{display:none;}
}

.seat .eqs b.v{font-weight:700;margin-left:3px;font-style:normal;}
.seat .eqs b.v.range{color:#f0cd7a;}
.seat .eqs b.v.plus{color:#9fc8f0;}
.seat .eqs b.v.minus{color:#f0a0a8;}

/* ---------- 动画 ---------- */
.pc.enter{animation:cardEnter .42s cubic-bezier(.22,.61,.36,1) both;}
@keyframes cardEnter{
  0%{transform:translateY(-26px) scale(.86) rotate(-4deg);opacity:0;}
  60%{transform:translateY(2px) scale(1.02) rotate(1deg);opacity:1;}
  100%{transform:translateY(0) scale(1) rotate(0);opacity:1;}
}
.pc.sm{animation:cardLand .28s ease-out both;}
@keyframes cardLand{0%{transform:translateY(8px) scale(.96);opacity:.6;}100%{transform:translateY(0) scale(1);opacity:1;}}
.seat.hurt{animation:hurtFlash .55s ease-out;}
@keyframes hurtFlash{
  0%{box-shadow:0 0 0 2px var(--red2),0 0 22px rgba(200,16,46,.7);background:rgba(200,16,46,.28);}
  100%{box-shadow:none;background:rgba(36,30,25,.94);}
}
.seat.heal{animation:healFlash .55s ease-out;}
@keyframes healFlash{
  0%{box-shadow:0 0 0 2px var(--jade),0 0 22px rgba(79,156,120,.6);background:rgba(79,156,120,.25);}
  100%{box-shadow:none;background:rgba(36,30,25,.94);}
}
#myStats.hurt{animation:myHurt .55s ease-out;}
@keyframes myHurt{0%{color:#ff8a9a;text-shadow:0 0 14px rgba(200,16,46,.9);}100%{color:var(--dim);}}
#myStats.heal{animation:myHeal .55s ease-out;}
@keyframes myHeal{0%{color:#8fe0b8;text-shadow:0 0 14px rgba(79,156,120,.9);}100%{color:var(--dim);}}
.seat.turn{animation:turnPulse 1.8s ease-in-out infinite;}
@keyframes turnPulse{
  0%,100%{box-shadow:0 0 0 1px var(--gold),0 0 12px rgba(216,169,75,.28);}
  50%{box-shadow:0 0 0 1px var(--gold),0 0 20px rgba(216,169,75,.5);}
}
/* 竖屏时给个提示：横过来牌更大 */
#rotateTip{position:fixed;bottom:calc(100% - 42vh);left:50%;transform:translateX(-50%);z-index:30;
  font-size:11px;color:var(--dim2);background:rgba(0,0,0,.6);padding:4px 10px;border-radius:8px;
  pointer-events:none;}
@media (orientation:landscape){ #rotateTip{display:none;} }

/* ---------- 开始页 ---------- */
#setup{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:20px;
  background:radial-gradient(ellipse at 50% 40%,#16201a,#070906 70%);}
#setup h1{font-size:clamp(26px,5vw,40px);letter-spacing:clamp(8px,2vw,18px);margin:0;color:var(--red2);
  text-shadow:0 3px 18px rgba(200,16,46,.55);font-weight:700;}
#setup .sub{color:var(--dim2);font-size:11px;letter-spacing:4px;margin-top:-6px;}
#setup .box{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}

<script>
"use strict";
/* ============================================================
   单机版牌桌界面。引擎跑在浏览器里（不用服务端）。
   界面**不做任何规则判断**：能出什么、能打谁，全部问内核。
   ============================================================ */
const $ = (id) => document.getElementById(id);
const PHASE = { start:'准备', judge:'判定', draw:'摸牌', play:'出牌', discard:'弃牌', end:'结束' };
const { Game, SimpleAi, def, GENERAL_DEFS } = window.SGS;

let game = null, ai = null;
let selUid = null, selAsName = null, selViaSkill = null, discardPick = [];
let lastLogText = '';
let lastPlayed = '';   // 上一次中央区显示的内容指纹，用于避免无谓重绘
/** 上一帧的手牌 uid（用来判断"哪些是新摸进来的"→ 飞入动画） */
let prevHandUids = new Set();
/** 上一帧出牌区的 uid（用来判断"哪张是新打出的"→ 飞出去） */
let prevPlayedUids = new Set();
/** 上一帧各人血量（用来判断谁受伤/回血 → 闪一下） */
let prevHp = {};
/** 本次 render 是否要做动画（只有"因为玩家或电脑动作而重绘"时才做） */
let animate = false;
const YOU = 'p1';


/**
 * 安全取牌名。
 * 界面**绝不能因为某张牌取不到定义就整个崩掉**——一崩整张桌子都白了，
 * 玩家还以为是网络问题。取不到就显示占位符，牌局照常进行。
 */
function safeName(c){
  if (!c) return '?';
  try { const d = def(c); return d ? d.name : '?'; }
  catch (e) { return '?'; }
}

/** 把引擎的 PlayerState 转成界面用的座位数据（卡面渲染在共享模块里） */
function seatView(p, s){
  const g = GENERAL_DEFS[p.generalId] || {};
  return {
    id: p.id,
    name: p.name,
    generalId: p.generalId,
    generalName: g.name || p.generalId,
    hp: p.hp,
    maxHp: p.maxHp,
    alive: p.alive,
    identity: p.identity,
    handCount: p.hand.length,
    equips: Object.values(p.equips || {}).filter(Boolean).map((c) => {
      let vb = null;
      try { vb = valueBadgeOf(def(c)); } catch (e) { /* 取不到就算了 */ }
      return { name: safeName(c), value: vb ? vb.text : null, kind: vb ? vb.kind : null };
    }),
    judges: (p.judges || []).map((c) => ({ name: safeName(c) })),
    isTurn: p.id === s.turnPlayer,
    // 身份是否公开由内核判定（主公公开、自己知道、阵亡公开、结算公开，其余未知）
    identityKnown: game.canSeeIdentity(YOU, p.id),
    isSelf: p.id === YOU,
  };
}

/* 卡牌外观由共享模块 packages/ui/src/cards.ts 提供
   （单机版和联机版共用，改一处两边都变；那块代码有 12 个单测兜着）*/
const { cardHTML, seatHTML, escHtml: esc, SUIT_LABEL, IDENT_LABEL, IDENT_CLS,
        flyCard, rectOf, cardDetailHTML, avatarHTML, skillsHTML,
        valueBadgeOf } = window.SGS.cards;
const SUIT = SUIT_LABEL;
const RED_SUIT = { heart:1, diamond:1 };
const IDENT = IDENT_LABEL;

/* ============================================================
   详情弹窗：点牌看规则 / 点头像看技能
   ============================================================ */
function openModal(html){
  $('modalBox').innerHTML = html + '<div style="text-align:center;margin-top:14px">'
    + '<button id="modalClose" class="primary">关闭</button></div>';
  $('modal').classList.remove('hide');
  $('modalClose').onclick = closeModal;
}
function closeModal(){ $('modal').classList.add('hide'); }

/** 安全地给元素绑点击（元素不存在就安静跳过，不让界面崩） */
function bindClick(el, fn){
  if (el && typeof el === 'object') { try { el.onclick = fn; } catch (e) { /* 忽略 */ } }
}
/** 安全地批量绑定（querySelectorAll 在测试桩里可能返回空） */
function bindAll(root, sel, fn){
  if (!root || typeof root.querySelectorAll !== 'function') return;
  try {
    root.querySelectorAll(sel).forEach((el, i) => { try { fn(el, i); } catch (e) { /* 忽略 */ } });
  } catch (e) { /* 忽略 */ }
}

/** 点一张牌 → 显示它的规则详情 */
function showCardDetail(c){
  let d;
  try { d = def(c); } catch (e) { return; }
  openModal(
    '<div class="m-head">' + avatarHTML({ id: d.id, name: d.name, kingdom: 'qun' }, 'sm')
      + '<div><h3>【' + esc(d.name) + '】</h3>'
      + '<div class="m-sub">' + SUIT[c.suit] + c.rank + ' · ' + esc(d.type) + '</div></div>'
      + '</div>'
    + cardDetailHTML(d)
  );
}

/** 点头像 → 显示武将技能表 */
function showGeneralDetail(gid){
  const g = GENERAL_DEFS[gid];
  if (!g) return;
  const kd = { wei:'魏', shu:'蜀', wu:'吴', qun:'群' }[g.kingdom] || '';
  openModal(
    '<div class="m-head">' + avatarHTML(g, 'sm')
      + '<div><h3>' + esc(g.name) + '</h3>'
      + '<div class="m-sub">' + kd + ' · ' + esc(g.title || '') + ' · ' + g.hp + ' 体力</div></div>'
      + '</div>'
    + skillsHTML(g)
  );
}

/* ============================================================
   开局
   ============================================================ */
function start(n){
  const ids = Object.keys(GENERAL_DEFS);
  const pool = ids.slice(), pick = [];
  while (pick.length < n && pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  game = new Game({
    players: pick.map((gid, i) => ({
      id: 'p' + (i+1),
      name: i === 0 ? '你' : ('电脑·' + (GENERAL_DEFS[gid].name || gid)),
      generalId: gid,
    })),
  });
  ai = new SimpleAi({ seed: Date.now() & 0xffff });
  selUid = selAsName = selViaSkill = null;
  discardPick = []; lastLogText = ''; lastPlayed = '';
  game.start();
  $('setup').classList.add('hide');
  $('table').classList.remove('hide');
  step();
}

/* 只在"该你动手"时停下 */
function step(){
  if (!game) return;
  let guard = 0;
  while (guard++ < 400 && !game.state.winner){
    const pend = game.currentPrompt();
    if (!pend || pend.player === YOU) break;
    const before = token();
    let err = null;
    try { err = ai.step(game); }
    catch (e) {
      // AI 某一步出错不该让整桌白屏；记一笔、让玩家接着操作
      err = (e && e.message) || String(e);
      console.error('AI 出错：', err);
    }
    if (err || token() === before) break;
  }
  animate = true; // 这轮是"有人真的动了"，动画可以放
  render();
}
function token(){
  const s = game.state, p = game.currentPrompt();
  return [s.turn, s.phase, s.players.map((x) => x.hp+'/'+x.hand.length).join(','),
    s.drawPile.length, s.discardPile.length, p ? p.player+p.kind+p.hint.slice(0,14) : '-'].join('|');
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  if (!game) return;
  const s = game.state, pend = game.currentPrompt();
  const me = s.players.find((p) => p.id === YOU);

  /* ---- 对手 ---- */
  const ob = $('opponents');
  ob.innerHTML = s.players.filter((p) => p.id !== YOU)
    .map((p) => seatHTML(seatView(p, s))).join('');
  // 点对手的座位 → 看他的武将技能（谁不想知道对面什么将）
  const foes = s.players.filter((p) => p.id !== YOU);
  bindAll(ob, '.seat', (el, i) => {
    const foe = foes[i];
    if (foe) el.onclick = () => showGeneralDetail(foe.generalId);
  });

  /* ---- 中央 ---- */
  $('turnInfo').innerHTML = s.winner
    ? '本局结束'
    : '第 <b>' + s.turn + '</b> 回合 · <b>' + (PHASE[s.phase] || s.phase) + '</b> · 牌堆 <b>' + s.drawPile.length + '</b>';

  // 中央展示：最近一次被使用/打出的牌（从事件里找）
  const recent = recentCards(s);
  // **公开亮出的牌也要画出来**：过河拆桥拆掉了什么、顺手牵羊拿走了什么，
  // 光有日志文字玩家看不明白（用户反馈："我拆别人牌应该亮出来吧"）。
  const revealed = (s.reveals || []).slice(-2).filter((r) => r.card);
  const key = recent.map((c) => c.uid).join(',') + '|' + revealed.map((r) => r.card.uid).join(',');
  const playedChanged = key !== lastPlayed;
  if (playedChanged){
    lastPlayed = key;
    const parts = recent.map((c) => { try { return cardHTML(c, def(c), 'sm'); } catch (e) { return ''; } });
    revealed.forEach((r) => {
      const who = s.players.find((x) => x.id === r.from);
      const label = r.kind === 'steal' ? '拿走' : '弃置';
      parts.push('<span class="revealTip">' + label + '<br>' + esc(who ? who.name : '') + '</span>');
      try { parts.push(cardHTML(r.card, def(r.card), 'sm', { cls: 'revealed' })); } catch (e) { /* 忽略 */ }
    });
    $('played').innerHTML = parts.length
      ? parts.join('')
      : '<span style="color:var(--dim2);font-size:12px">— 出牌区 —</span>';
    // 中央的牌点一下也能看规则
    const all = [...recent, ...revealed.map((r) => r.card)];
    bindAll($('played'), '[data-uid]', (el) => {
      const found = all.find((c) => c && c.uid === el.dataset.uid);
      if (found) el.onclick = () => showCardDetail(found);
    });
  }

  const hb = $('hintBar');
  if (s.winner){
    const win = s.winner.some((w) => w === me.identity);
    hb.textContent = (win ? '🏆 你赢了！' : '本局结束。') + '胜方：' + s.winner.map((w) => IDENT[w] || w).join('、');
    hb.className = '';
  } else if (pend && pend.player === YOU){
    hb.textContent = pend.hint;
    hb.className = '';
  } else {
    const t = s.players.find((p) => p.id === s.turnPlayer);
    hb.textContent = '等待 ' + (t ? t.name : '其他玩家') + ' 行动…';
    hb.className = 'wait';
  }

  const lastLog = s.log.length ? s.log[s.log.length-1].text : '';
  $('logBar').textContent = lastLog;

  /* ---- 左侧：我的头像（点开看技能） + 状态 ---- */
  const g = GENERAL_DEFS[me.generalId] || {};
  const av = $('avatarWrap');
  av.innerHTML = avatarHTML(g, 'lg') + '<div style="font-size:10px;color:var(--dim2);text-align:center;margin-top:3px">点我看技能</div>';
  bindClick(av && typeof av.querySelector === 'function' ? av.querySelector('.avatar') : null,
    () => showGeneralDetail(me.generalId));
  let hearts2 = '';
  for (let i = 0; i < me.maxHp; i++) hearts2 += i < me.hp ? '♥' : '<span style="opacity:.28">♥</span>';
  $('myStats').innerHTML = '<div class="hearts">' + hearts2 + '</div>'
    + '<div>' + me.hp + '/' + me.maxHp + ' 体力</div>';

  /* ---- 我的信息 ---- */
  const myEq = Object.entries(me.equips || {}).filter(([,v]) => v)
    .map(([,v]) => {
      let vb = null;
      try { vb = valueBadgeOf(def(v)); } catch (e) { /* 忽略 */ }
      return '<span class="eqs"><span>' + esc(safeName(v))
        + (vb ? '<b class="v ' + vb.kind + '">' + esc(vb.text) + '</b>' : '')
        + '</span></span>';
    }).join('');
  const myJd = (me.judges||[]).map((c) => '<span class="eqs"><span class="j">' + esc(safeName(c)) + '</span></span>').join('');
  let hearts = '';
  for (let i = 0; i < me.maxHp; i++) hearts += i < me.hp ? '♥' : '<span style="opacity:.28">♥</span>';
  // 体力已经在左上方显示了（#myStats），这里不再重复画一遍
  $('myInfo').innerHTML =
    '<span class="badge ' + (IDENT_CLS[me.identity]||'') + '">' + (IDENT[me.identity]||me.identity) + '</span>' +
    '<span class="badge trait">' + esc(g.name || me.generalId) + '</span>' +
    myEq + myJd;
  $('myInfo').className = s.turnPlayer === YOU ? '' : '';
  if (s.turnPlayer === YOU) $('myInfo').style.textShadow = '0 0 10px rgba(216,169,75,.6)';
  else $('myInfo').style.textShadow = '';

  /* ---- 我的手牌 ---- */
  const canPlay = pend && pend.player === YOU && (pend.kind === 'play' || pend.kind === 'discard');
  const opts = pend && pend.player === YOU && pend.kind === 'play' ? game.skillPlayOptions(YOU) : [];
  const usable = new Set(opts.map((o) => o.cardUid));
  $('myHand').innerHTML = me.hand.map((c) => {
    const isPlay = pend && pend.kind === 'play' && pend.player === YOU;
    const dis = isPlay && !usable.has(c.uid) ? ' dis' : '';
    const sel = selUid === c.uid ? ' up' : '';
    // 新摸到的牌（上一帧没有）标 enter，靠 CSS 做"飞进手里"的观感。
    // 直接在生成时判断，而不是事后 querySelector 去找元素——后者依赖 DOM 查询，
    // 在测试桩里拿不到元素就永远不会触发（踩过）。
    const enter = animate && !prevHandUids.has(c.uid) ? ' enter' : '';
    const badge = discardPick.includes(c.uid) ? { badge: '弃' } : null;
    const extra = { cls: (sel + dis + enter).trim(), ...(badge || {}) };
    try { return cardHTML(c, def(c), '', extra); }
    catch (e) { return ''; } // 画不出来就跳过这张，不让整桌崩
  }).join('');
  if (canPlay){
    bindAll($('myHand'), '[data-uid]', (el) => {
      el.onclick = () => onTap(el.dataset.uid, pend, opts);
    });
  }
  prevHandUids = new Set(me.hand.map((c) => c.uid));

  /* ---- 动作区 ---- */
  renderActions(pend, s, me);

  /* ---- 动画 ---- */
  if (animate){
    // 1) 刚打出的牌：从"它来的地方"飞到中央
    if (playedChanged && recent.length){
      const addrs = (typeof $('played').querySelectorAll === 'function')
        ? $('played').querySelectorAll('.pc') : [];
      const newOnes = recent.filter((c) => !prevPlayedUids.has(c.uid));
      newOnes.forEach((c) => {
        const idx = recent.findIndex((x) => x.uid === c.uid);
        const to = rectOf(addrs[idx] || null);
        if (!to) return;
        // 来源：如果这张牌刚才还在我手里，就从手牌位置飞；否则从对方座位飞
        const el = (typeof $('myHand').querySelector === 'function')
          ? $('myHand').querySelector('[data-uid="' + c.uid + '"]') : null;
        const from = rectOf(el) || null;
        try {
          flyCard(document, { to, from: from || undefined, spin: from ? -8 : 6,
            html: cardHTML(c, def(c), 'sm') });
        } catch (e) { /* 动画失败不影响玩 */ }
      });
    }
    // 2) 有人掉血/回血：闪一下（红=掉血，绿=回血）
    s.players.forEach((p) => {
      const was = prevHp[p.id];
      if (was === undefined || was === p.hp) return;
      const box = $('opponents');
      const el = (typeof box.querySelector === 'function')
        ? box.querySelector('.seat:nth-child(' + seatIndex(p, s) + ')') : null;
      const target = el || (p.id === YOU ? $('myInfo') : null);
      if (target) flashHp(target, p.hp > was ? 'heal' : 'hurt');
    });
  }
  prevPlayedUids = new Set(recent.map((c) => c.uid));
  prevHp = Object.fromEntries(s.players.map((p) => [p.id, p.hp]));
  animate = false;
}

/** 对手座位里，某个玩家排第几（CSS nth-child 从 1 开始） */
function seatIndex(p, s){
  return s.players.filter((x) => x.id !== YOU).findIndex((x) => x.id === p.id) + 1;
}

/** 让一个元素闪一下（掉血红 / 回血绿） */
function flashHp(el, kind){
  el.classList.remove('hurt', 'heal');
  void el.offsetWidth; // 强制重排，这样连续两次也能重新触发动画
  el.classList.add(kind);
  setTimeout(() => el.classList.remove(kind), 600);
}

/** 座位卡（对手 + 自己信息用小卡） */
function recentCards(s){
  const out = [];
  for (let i = s.queue.length - 1; i >= 0 && out.length < 3; i--){
    const e = s.queue[i];
    if (!e) continue;
    if (e.type === 'useCard' && e.card) out.push(e.card);
    else if (e.type === 'respondCard' && e.card) out.push(e.card);
  }
  return out.reverse();
}

function onTap(uid, pend, opts){
  if (pend.kind === 'discard'){
    const i = discardPick.indexOf(uid);
    if (i >= 0) discardPick.splice(i, 1); else discardPick.push(uid);
    render(); return;
  }
  const vs = opts.filter((o) => o.cardUid === uid);
  // 再点一次已选中的牌 → 看这张牌的规则详情（不用另设按钮，横版空间宝贵）
  if (selUid === uid){
    const c = game.player(YOU).hand.find((x) => x.uid === uid);
    if (c) showCardDetail(c);
    return;
  }
  if (!vs.length) return;
  selUid = uid; selAsName = vs[0].asName; selViaSkill = vs[0].viaSkillId;
  render();
}

function act(action){
  const err = game.submit(action);
  if (err){
    const hb = $('hintBar');
    hb.textContent = '⚠ ' + err; hb.className = 'warn';
    return;
  }
  step();
}

function renderActions(pend, s, me){
  const box = $('actions');
  box.innerHTML = '';
  if (!pend || pend.player !== YOU || s.winner){
    if (s.winner){
      const b = document.createElement('button');
      b.className = 'primary'; b.textContent = '再来一局';
      b.onclick = () => location.reload();
      box.appendChild(b);
    }
    return;
  }

  if (pend.kind === 'play'){
    const opts = game.skillPlayOptions(YOU);
    if (selUid){
      const vs = opts.filter((o) => o.cardUid === selUid);
      if (vs.length > 1){
        vs.forEach((v) => {
          const b = document.createElement('button');
          b.className = v.asName === selAsName ? 'primary' : 'gold';
          b.textContent = v.viaSkillId ? v.label : ('当【' + v.asName + '】用');
          b.onclick = () => { selAsName = v.asName; selViaSkill = v.viaSkillId; render(); };
          box.appendChild(b);
        });
      }
      const cur = vs.find((v) => v.asName === selAsName) || vs[0];
      // **只有真正需要玩家挑目标的牌才显示目标列表**。
      // 不能用 legalTargetsForAs().length 判断——那个函数为 AOE 补全会返回全体角色，
      // 会让【仁王盾】也弹出"选个目标"（实际是装自己）。
      const targets = cur && game.needsTargetChoice(cur.asName)
        ? game.legalTargetsForAs(YOU, cur.asName, cur.cards[0]) : [];
      targets.forEach((tid) => {
        const tp = s.players.find((x) => x.id === tid);
        const b = document.createElement('button');
        b.className = 'gold';
        b.textContent = '→ ' + (tp ? tp.name : tid);
        b.onclick = () => { const a = { kind:'playCard', cardUid:selUid, targets:[tid], asName:selAsName, viaSkillId:selViaSkill }; selUid = selAsName = selViaSkill = null; act(a); };
        box.appendChild(b);
      });
      if (targets.length === 0){
        const b = document.createElement('button');
        b.className = 'primary';
        b.textContent = '使用【' + selAsName + '】';
        b.onclick = () => { const a = { kind:'playCard', cardUid:selUid, targets:[], asName:selAsName, viaSkillId:selViaSkill }; selUid = selAsName = selViaSkill = null; act(a); };
        box.appendChild(b);
      }
      const c = document.createElement('button');
      c.textContent = '取消';
      c.onclick = () => { selUid = null; render(); };
      box.appendChild(c);
    }
    game.activeSkills(YOU).forEach((sk) => {
      const b = document.createElement('button');
      b.className = 'gold'; b.textContent = sk.name; b.title = sk.label;
      b.onclick = () => act({ kind:'useSkill', skillId:sk.id });
      box.appendChild(b);
    });
    const e = document.createElement('button');
    e.textContent = '结束出牌';
    e.onclick = () => { selUid = null; act({ kind:'endPhase' }); };
    box.appendChild(e);
    return;
  }

  if (pend.kind === 'respond'){
    const need = (pend.expect || [])[0];
    me.hand.filter((c) => !need || safeName(c) === need).forEach((c) => {
      const b = document.createElement('button');
      b.className = 'primary';
      b.textContent = '打出【' + safeName(c) + '】';
      b.onclick = () => act({ kind:'respond', cardUid:c.uid });
      box.appendChild(b);
    });
    const p = document.createElement('button');
    p.textContent = '放弃';
    p.onclick = () => act({ kind:'pass' });
    box.appendChild(p);
    return;
  }

  if (pend.kind === 'choose'){
    (pend.options || []).forEach((o, i) => {
      const b = document.createElement('button');
      const id = String(o.id || '');
      const isYes = ['yes','go'].includes(id);
      const isNo = ['no','__pass__','__skip__','__decline__','__stop__'].includes(id);
      b.className = isYes ? 'primary' : (isNo ? '' : (i === 0 ? 'gold' : ''));
      b.textContent = o.label || o.id;
      b.onclick = () => act({ kind:'choose', optionId:o.id });
      box.appendChild(b);
    });
    return;
  }

  if (pend.kind === 'discard'){
    const need = pend.count || 0;
    const info = document.createElement('span');
    info.style.cssText = 'font-size:12px;color:var(--dim);align-self:center';
    info.textContent = '已选 ' + discardPick.length + '/' + need + '（点手牌）';
    box.appendChild(info);
    const ok = document.createElement('button');
    ok.className = 'primary'; ok.textContent = '确定弃牌';
    ok.disabled = discardPick.length !== need;
    ok.onclick = () => { const a = { kind:'discard', cardUids:discardPick.slice() }; discardPick = []; act(a); };
    box.appendChild(ok);
  }
}

document.querySelectorAll('[data-n]').forEach((b) => {
  b.onclick = () => start(Number(b.dataset.n));
});
window.addEventListener('resize', () => { if (game) render(); });

/* 注册一个最小 Service Worker（Blob 内联，保持单文件）。
   作用：加到主屏幕后**离线也能打开**——不用每次联网。
   file:// 下浏览器不允许注册 SW，失败就安静跳过，不影响玩。 */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  try {
    const swSrc = [
      "self.addEventListener('install', () => self.skipWaiting());",
      "self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));",
      "self.addEventListener('fetch', (e) => {",
      "  e.respondWith(caches.open('sgs-v1').then((c) =>",
      "    fetch(e.request).then((r) => { c.put(e.request, r.clone()); return r; })",
      "                        .catch(() => c.match(e.request))));",
      "});",
    ].join('\n');
    const url = URL.createObjectURL(new Blob([swSrc], { type: 'text/javascript' }));
    navigator.serviceWorker.register(url).catch(() => {});
  } catch (e) { /* 不影响玩 */ }
}
</script>
